[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-english"
version = "0.1.0"
description = "Convert text containing LaTeX math into plain English for text-to-speech."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Joseph Rich" }]
keywords = ["latex", "math", "text-to-speech", "accessibility", "tts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
math2english = "math_to_english.cli:main"

[project.urls]
Homepage = "https://github.com/josephrich98/math-to-english"

[tool.setuptools.packages.find]
include = ["math_to_english*"]
